<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>My IPTV</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    header, main { padding: 18px; }
    h1 { margin: 0 0 16px; }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    input, button {
      font-size: 17px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
    }
    input { flex: 1; min-width: 220px; }
    button { cursor: pointer; }
    #status { color: #bbb; margin: 16px 0; }
    #tabs { display: none; gap: 8px; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
      gap: 10px;
    }
    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      margin-bottom: 15px;
    }
    small { color: #888; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
</head>

<body>
<header>
  <h1>My IPTV</h1>

  <div class="row">
    <input id="server" placeholder="Server">
  </div>

  <div class="row">
    <input id="username" placeholder="Username">
  </div>

  <div class="row">
    <input id="password" type="password" placeholder="Password">
    <button id="connect">Bağlan</button>
  </div>

  <small>Şifre kalıcı olarak kaydedilmez.</small>
</header>

<main>
  <div id="status">Hazır.</div>

  <div id="tabs">
    <button data-type="live">Canlı TV</button>
    <button data-type="vod">Filmler</button>
    <button data-type="series">Diziler</button>
  </div>

  <video id="video" controls playsinline style="display:none"></video>
  <div id="list" class="grid"></div>
</main>

<script>
const PROXY = "https://tesla-iptv.gulerhll.workers.dev";

let auth = null;
let hls = null;

const $ = id => document.getElementById(id);
const status = $("status");
const list = $("list");
const video = $("video");

function cleanServer(s) {
  return s.trim().replace(/\/+$/, "");
}

function viaProxy(target) {
  return PROXY + "/?url=" + encodeURIComponent(target);
}

async function proxyFetch(target) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    const r = await fetch(viaProxy(target), {
      cache: "no-store",
      signal: controller.signal
    });

    if (!r.ok) {
      throw new Error("HTTP " + r.status);
    }

    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

async function api(action = "") {
  const base =
    `${auth.server}/player_api.php?username=${encodeURIComponent(auth.username)}` +
    `&password=${encodeURIComponent(auth.password)}`;

  return proxyFetch(action ? base + "&action=" + action : base);
}

async function connect() {
  status.textContent = "Bağlanıyor...";
  list.innerHTML = "";

  const server = cleanServer($("server").value);
  const username = $("username").value.trim();
  const password = $("password").value;

  if (!server || !username || !password) {
    status.textContent = "Server, Username ve Password alanlarını doldur.";
    return;
  }

  auth = { server, username, password };

  try {
    const data = await api();

    if (!data.user_info || Number(data.user_info.auth) !== 1) {
      throw new Error("Giriş reddedildi.");
    }

    sessionStorage.setItem("iptv_server", server);
    sessionStorage.setItem("iptv_username", username);

    $("tabs").style.display = "flex";
    status.textContent = "Bağlantı başarılı.";
    await loadList("live");

  } catch (e) {
    if (e.name === "AbortError") {
      status.textContent = "Bağlantı zaman aşımına uğradı.";
    } else {
      status.textContent = "Bağlantı başarısız: " + e.message;
    }
  }
}

async function loadList(type) {
  list.innerHTML = "";
  video.style.display = "none";

  let action;
  if (type === "live") action = "get_live_streams";
  if (type === "vod") action = "get_vod_streams";
  if (type === "series") action = "get_series";

  status.textContent = "Liste yükleniyor...";

  try {
    const items = await api(action);

    if (!Array.isArray(items)) {
      throw new Error("Liste alınamadı.");
    }

    status.textContent = `${items.length} içerik bulundu.`;

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = item.name || "İsimsiz";

      if (type === "live") {
        card.onclick = () => playLive(item.stream_id);
      } else if (type === "vod") {
        card.onclick = () =>
          playVod(item.stream_id, item.container_extension || "mp4");
      } else {
        card.onclick = () => {
          status.textContent =
            "Dizi bölüm desteğini sonraki adımda ekleyeceğiz.";
        };
      }

      list.appendChild(card);
    });

  } catch (e) {
    status.textContent = "Liste hatası: " + e.message;
  }
}

function stopPlayer() {
  if (hls) {
    hls.destroy();
    hls = null;
  }
  video.pause();
  video.removeAttribute("src");
  video.load();
}

function playLive(id) {
  stopPlayer();

  const direct =
    `${auth.server}/live/${encodeURIComponent(auth.username)}/` +
    `${encodeURIComponent(auth.password)}/${id}.m3u8`;

  const src = viaProxy(direct);

  video.style.display = "block";
  video.scrollIntoView({ behavior: "smooth" });

  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = src;
    video.play().catch(() => {});
  } else if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });
  } else {
    status.textContent = "Bu tarayıcı HLS oynatmayı desteklemiyor.";
  }
}

function playVod(id, ext) {
  stopPlayer();

  const direct =
    `${auth.server}/movie/${encodeURIComponent(auth.username)}/` +
    `${encodeURIComponent(auth.password)}/${id}.${ext}`;

  video.src = viaProxy(direct);
  video.style.display = "block";
  video.scrollIntoView({ behavior: "smooth" });
  video.play().catch(() => {});
}

$("connect").onclick = connect;

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.onclick = () => loadList(btn.dataset.type);
});

$("server").value = sessionStorage.getItem("iptv_server") || "";
$("username").value = sessionStorage.getItem("iptv_username") || "";
</script>
</body>
</html>
